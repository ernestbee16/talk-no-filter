services:
  - type: web
    name: talk-no-filter-backend
    env: node
    region: oregon
    plan: free
    buildCommand: if [ -d "backend" ]; then cd backend; fi && npm install && npx prisma generate && npx tsc
    startCommand: if [ -d "backend" ]; then cd backend; fi && npm run start
    envVars:
      - key: PORT
        value: 5000
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: talk-no-filter-db
          property: connectionString

databases:
  - name: talk-no-filter-db
    plan: free
    databaseName: talk_no_filter
    user: talk_no_filter_user
